        return () => clearTimeout(timer);
      }, [toastMsg]);

      // 頁面滾動進度與故事章節感應
      useEffect(() => {
        const handleScroll = () => {
          const total = document.documentElement.scrollHeight - window.innerHeight;
          if (total > 0) {
            setScrollProgress(Math.min(100, Math.max(0, (window.scrollY / total) * 100)));
          }
          if (storySectionRef.current) {
            const rect = storySectionRef.current.getBoundingClientRect();
            const triggerY = window.innerHeight * 0.55;
            if (rect.top < triggerY && rect.bottom > 0) {
              const ratio = Math.min(1, Math.max(0, (triggerY - rect.top) / rect.height));
              const idx = Math.min(STORY_CHAPTERS.length - 1, Math.floor(ratio * STORY_CHAPTERS.length));
              setActiveChapterIdx(idx);
            }
          }
        };
        window.addEventListener('scroll', handleScroll, { passive: true });
        return () => window.removeEventListener('scroll', handleScroll);
      }, []);

      // 背景漂浮金色記憶塵埃與迷霧粒子 Canvas
      useEffect(() => {
        const canvas = fogCanvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let animId;
        let w = (canvas.width = window.innerWidth);
        let h = (canvas.height = window.innerHeight);

        const onResize = () => {
          w = canvas.width = window.innerWidth;
          h = canvas.height = window.innerHeight;
        };
        window.addEventListener('resize', onResize);

        const particles = Array.from({ length: 55 }, () => ({
          x: Math.random() * w,
          y: Math.random() * h,
          r: Math.random() * 2.2 + 0.6,
          vx: (Math.random() - 0.5) * 0.35,
          vy: -Math.random() * 0.45 - 0.12,
          isGold: Math.random() > 0.35
        }));

        const render = () => {
          ctx.clearRect(0, 0, w, h);
          particles.forEach((p) => {
            p.x += p.vx;
            p.y += p.vy;
            if (p.y < -10) {
              p.y = h + 10;
              p.x = Math.random() * w;
            }
            if (p.x < -10) p.x = w + 10;
            if (p.x > w + 10) p.x = -10;

            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
            ctx.fillStyle = isClairvoyance
              ? 'rgba(56, 189, 248, 0.38)'
              : p.isGold
              ? 'rgba(200, 160, 85, 0.38)'
              : 'rgba(234, 224, 206, 0.18)';
            ctx.fill();
          });
          animId = requestAnimationFrame(render);
        };
        render();

        return () => {
          cancelAnimationFrame(animId);
          window.removeEventListener('resize', onResize);
        };

                            <span
                              className={`px-2 py-0.5 rounded text-[10px] ${
                                unlocked ? 'bg-[#1A1721]/15 text-[#1A1721]' : 'bg-[#8B1E24] text-[#EAE0CE]'
                              }`}
                            >
                              {unlocked ? '已破譯' : '點擊破譯'}
                            </span>
                          </div>
                          {unlocked && <p className="text-xs text-[#1A1721]/90 mt-1.5 leading-relaxed">{d.text}</p>}
                        </div>
                      );
                    })}
                  </div>
                </div>
              </div>
            </div>
          </section>

          {/* ================================================================ */}
          {/* 5. 04. 案件故事卷宗與終局試煉 (STORY & FINALE)                    */}
          {/* ================================================================ */}
          <section
            id="story"
            ref={storySectionRef}
            className="relative z-10 max-w-6xl mx-auto px-4 sm:px-6 py-20 space-y-16"
          >
            <div className="text-center space-y-2">
              <span className="text-xs font-display tracking-[0.28em] text-[#C8A055]">04 // SEVEN-DAY FACELESS CASE CHRONICLES</span>
              <h2 className="text-3xl sm:text-4xl font-black text-[#EAE0CE]">七日無面失蹤案・案件故事卷宗</h2>
              <p className="text-xs sm:text-sm text-[#EAE0CE]/70 max-w-2xl mx-auto">
                沿著因果紅線回溯 1888 年 11 月的七日謎團；開啟「心眼透視」可顯影隱藏在字裡行間的裡世界預言。
              </p>
            </div>

            {/* 四大章節因果紅線時間軸 */}
            <div className="relative pl-6 sm:pl-12 space-y-10">
              {/* 垂直導線與動態進度紅線 */}
              <div className="absolute left-2.5 sm:left-5 top-2 bottom-2 w-1 bg-zinc-800 rounded-full overflow-hidden">
                <div
                  className={`w-full transition-all duration-500 ${
                    isClairvoyance ? 'bg-sky-400' : 'bg-gradient-to-b from-[#8B1E24] via-[#C8A055] to-[#8B1E24]'
                  }`}
                  style={{ height: `${((activeChapterIdx + 1) / STORY_CHAPTERS.length) * 100}%` }}
                />
              </div>

              {STORY_CHAPTERS.map((chap, idx) => {
                const isReached = idx <= activeChapterIdx;
                return (
                  <div
                    key={chap.num}
                    onClick={() => setActiveChapterIdx(idx)}
                    className={`cursor-pointer relative rounded-2xl p-6 sm:p-7 border transition-all duration-500 ${
                      isReached
                        ? 'bg-[#15131E]/95 border-[#C8A055]/65 shadow-[0_12px_35px_rgba(0,0,0,0.8)] opacity-100'
                        : 'bg-[#110F17]/75 border-zinc-800 opacity-70 hover:opacity-95'
                    }`}
                  >
                    {/* 火漆時間節點 */}
                    <span
                      className={`absolute -left-[25px] sm:-left-[39px] top-7 w-5 h-5 rounded-full border-2 transition-all ${
                        isReached
                          ? 'bg-[#8B1E24] border-[#C8A055] scale-125 shadow-[0_0_15px_rgba(200,160,85,0.85)]'
                          : 'bg-zinc-900 border-zinc-600'
                      }`}
                    />

                    <div className="flex flex-wrap items-center justify-between gap-2 mb-2">
                      <span className="text-xs font-mono font-bold px-2.5 py-0.5 rounded bg-[#8B1E24]/60 border border-[#C8A055]/50 text-[#C8A055]">
                        {chap.num} // {chap.date}
                      </span>
                      <span className="text-xs text-[#EAE0CE]/65 flex items-center gap-1">
                        <Icon name="MapPin" className="w-3.5 h-3.5 text-[#C8A055]" />
                        {chap.location}
                      </span>
                    </div>

                    <h3 className="text-xl sm:text-2xl font-black text-[#EAE0CE] mb-3">{chap.title}</h3>
                    <p className="text-xs sm:text-sm text-[#EAE0CE]/85 leading-relaxed">{chap.normalText}</p>

                    {isClairvoyance && (
                      <div className="mt-3.5 p-3.5 rounded-xl bg-sky-950/75 border border-sky-400/65 text-xs text-sky-200 leading-relaxed">
                        {chap.alterText}
                      </div>
                    )}

                    <div className="mt-4 pt-3 border-t border-[#C8A055]/25 flex items-center justify-between text-xs font-bold text-[#C8A055]">
                      <span>{chap.clueTag}</span>
                      <span>{isReached ? '● 紅線已連結' : '點擊提前檢視'}</span>
                    </div>
                  </div>
                );
              })}
            </div>

            {/* 頁尾互動式「最終推理試煉」召喚卡片 */}
            <div className="rounded-3xl p-8 sm:p-12 bg-gradient-to-b from-[#1B1422] to-[#0D0C11] border-2 border-[#C8A055]/60 shadow-2xl text-center space-y-6 relative overflow-hidden">
              <div className="w-16 h-16 rounded-full mx-auto bg-gradient-to-br from-[#8B1E24] to-[#3d080b] border-2 border-[#C8A055] shadow-xl flex items-center justify-center font-display font-black text-[#EAE0CE] text-lg">
                IV
              </div>

              <div className="space-y-2">
                <span className="text-xs font-display tracking-[0.3em] text-[#C8A055]">FINAL DEDUCTION TRIAL</span>
                <h3 className="text-2xl sm:text-4xl font-black text-[#EAE0CE]">
                  「當所有表象皆為謊言，唯有人偶的縫線記得真實。」
                </h3>
              </div>

              <p className="max-w-2xl mx-auto text-xs sm:text-sm text-[#EAE0CE]/80 leading-relaxed">
                你已走遍霧都倫敦五大調查區域，並翻閱了四位關鍵角色的演繹卷宗。現在，舉起你的火漆印章，接受 D.M 伯爵的最終推理試煉！
              </p>

              <div className="flex flex-wrap items-center justify-center gap-4 pt-2">
                <button
                  onClick={() => {
                    setTrialAnswer(null);
                    setTrialModalOpen(true);
                  }}
                  className="flex items-center gap-2 px-7 py-3.5 rounded-xl bg-gradient-to-r from-[#8B1E24] to-[#591115] hover:brightness-110 text-[#EAE0CE] font-black text-sm border-2 border-[#C8A055] shadow-[0_0_25px_rgba(139,30,36,0.7)] transition"
                >
                  <Icon name="Award" className="w-4 h-4 text-[#C8A055]" />
                  <span>開啟最終推理試煉</span>
                </button>

                <button
                  onClick={() => scrollToSection('hero')}
                  className="flex items-center gap-2 px-6 py-3.5 rounded-xl bg-black/80 hover:bg-zinc-900 text-[#C8A055] font-bold text-sm border border-[#C8A055]/45 transition"
                >
                  <Icon name="RotateCcw" className="w-4 h-4" />
                  <span>返回霧都起點</span>
                </button>
              </div>
            </div>

            {/* 維多利亞報紙頁尾版權欄 */}
            <footer className="grid grid-cols-1 md:grid-cols-3 gap-4 text-xs text-[#EAE0CE]/60 border-t border-[#C8A055]/25 pt-8">
              <div>
                <h4 className="font-black text-[#C8A055] mb-1">《真理之下 BENEATH THE TRUTH》</h4>
                <p>1888 維多利亞哥德懸疑偵探開放式世界官方概念網站。</p>
              </div>
              <div>
                <h4 className="font-black text-[#C8A055] mb-1">貝克街 221B 調查局</h4>
                <p>雙重世界心眼透視系統・維多利亞人偶立繪鑑賞室・七日案件卷宗。</p>
              </div>
              <div className="md:text-right">
                <h4 className="font-black text-[#C8A055] mb-1">CASE ARCHIVE NO. IV-1888</h4>
                <p>© 1888-2026 BENEATH THE TRUTH. ALL RIGHTS RESERVED.</p>
              </div>
            </footer>
          </section>

          {/* ================================================================ */}
          {/* 最終推理試煉解謎彈窗 (Modal)                                      */}
          {/* ================================================================ */}
          {trialModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/85 backdrop-blur-md p-4">
              <div className="max-w-lg w-full rounded-2xl p-6 sm:p-7 parchment-texture text-[#1A1721] border-2 border-[#C8A055] shadow-2xl relative space-y-4">
                <button
                  onClick={() => setTrialModalOpen(false)}
                  className="absolute top-4 right-4 w-8 h-8 rounded-full bg-[#1A1721]/10 hover:bg-[#8B1E24] hover:text-[#EAE0CE] flex items-center justify-center transition"
                >
                  <Icon name="X" className="w-4 h-4" />
                </button>

                <span className="text-[11px] font-display font-bold text-[#8B1E24]">FINAL DEDUCTION TRIAL // 1888</span>
                <h3 className="text-2xl font-black text-[#0D0C11]">最終推理試煉：誰是第零號人偶？</h3>
                <p className="text-xs sm:text-sm text-[#1A1721]/90 leading-relaxed">
                  根據你在霧都倫敦蒐集的所有卷宗與心眼透視線索，火漆邀請函上「編號 NO.00」的最初人偶實驗體究竟是誰？
                </p>

                <div className="space-y-2.5 pt-1">
                  {[
                    { id: 'a', text: 'A. 幕後贊助人 D.M 伯爵本人', correct: false },
                    { id: 'b', text: 'B. 失憶的私家偵探「推理先生」亞瑟·柯林斯', correct: true },
                    { id: 'c', text: 'C. 黑水河鐘樓的守望者白夜', correct: false }
                  ].map((opt) => (
                    <button
                      key={opt.id}
                      onClick={() => setTrialAnswer(opt)}
                      className="w-full text-left p-3.5 rounded-xl border border-[#1A1721]/30 bg-white/80 hover:bg-[#8B1E24] hover:text-[#EAE0CE] hover:border-[#C8A055] text-xs sm:text-sm font-bold transition"
                    >
                      {opt.text}
                    </button>
                  ))}
                </div>

                {trialAnswer && (
                  <div
                    className={`p-4 rounded-xl border text-xs leading-relaxed ${
                      trialAnswer.correct
                        ? 'bg-emerald-950 text-emerald-200 border-emerald-500'
                        : 'bg-[#470b0f] text-[#EAE0CE] border-[#C8A055]'
                    }`}
                  >
                    {trialAnswer.correct ? (
                      <div className="flex items-start gap-2.5">
                        <Icon name="CheckCircle2" className="w-5 h-5 text-emerald-400 shrink-0 mt-0.5" />
                        <div>
                          <strong className="block text-sm text-emerald-300 mb-1">【火漆裁決成立！真相大白】</strong>
                          你已成功連通所有因果紅線！亞瑟·柯林斯正是親手設計劇場並將自己改造成第零號人偶的「最初偵探」。歡迎正式踏入《真理之下》的完整冒險！
                        </div>
                      </div>
                    ) : (
                      <div className="flex items-start gap-2.5">
                        <Icon name="AlertTriangle" className="w-5 h-5 text-[#C8A055] shrink-0 mt-0.5" />
                        <div>
                          <strong className="block text-sm text-[#C8A055] mb-1">【紅線出現矛盾】</strong>
                          請開啟「心眼透視」或回顧「推理先生」大衣內襯的「NO.00」標籤，再次嘗試推論！
                        </div>
                      </div>
                    )}
                  </div>
                )}
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
